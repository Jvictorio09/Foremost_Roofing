<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/50 p-4 sm:p-8"
     x-data @click.self="$el.remove()" @keydown.escape.window="$el.remove()">
  <div class="my-auto w-full max-w-2xl rounded-2xl bg-white shadow-xl">
    <div class="flex items-center justify-between rounded-t-2xl border-b border-slate-200 px-6 py-3">
      <h3 class="text-sm font-semibold">{{ title }}</h3>
      <button type="button" onclick="this.closest('.fixed').remove()"
              class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form hx-post="{{ form_action }}" hx-target="#modal-root" hx-swap="innerHTML" class="p-6">
      {% csrf_token %}
      {% include 'admin/_user_form_fields.html' %}
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" onclick="this.closest('.fixed').remove()" class="rounded-lg border border-slate-200 px-5 py-2.5 text-sm font-medium hover:bg-slate-50">Cancel</button>
        <button class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800">Save</button>
      </div>
    </form>
  </div>
</div>
