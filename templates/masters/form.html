{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="text-2xl font-semibold tracking-tight">{{ title }}</h1></div>
<form method="post" enctype="multipart/form-data" class="max-w-3xl rounded-xl border border-slate-200 bg-white p-5">
  {% csrf_token %}
  <div class="grid gap-4 md:grid-cols-2">{% include 'partials/form_body.html' %}</div>
  <div class="mt-5 flex gap-3">
    <button class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800">Save</button>
    <a href="javascript:history.back()" class="rounded-lg border border-slate-200 px-5 py-2.5 text-sm font-medium hover:bg-slate-50">Cancel</a>
  </div>
</form>
{% endblock %}
