{% extends 'base.html' %}
{% block title %}System Settings{% endblock %}
{% block content %}
<div class="mb-6">
  <a href="{% url 'master_hub' %}" class="text-xs text-slate-400 hover:underline">Master Data</a>
  <h1 class="text-2xl font-semibold tracking-tight">System Settings</h1>
  <p class="mt-1 text-sm text-slate-500">Business rules (credit gate, waste %, thresholds) live here — change them without touching code.</p>
</div>
<form method="post" class="max-w-3xl rounded-xl border border-slate-200 bg-white p-5">
  {% csrf_token %}
  <div class="space-y-4">
    {% for s in settings %}
      <div class="grid grid-cols-3 items-center gap-3">
        <label class="col-span-1 text-sm font-medium text-slate-700">{{ s.key }}<div class="text-xs font-normal text-slate-400">{{ s.description }}</div></label>
        <input name="setting_{{ s.pk }}" value="{{ s.value }}" class="col-span-2 rounded-lg border border-slate-200 px-3 py-2 text-sm">
      </div>
    {% endfor %}
  </div>
  <div class="mt-5"><button class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800">Save Settings</button></div>
</form>
{% endblock %}
