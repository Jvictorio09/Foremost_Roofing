{% load core_tags %}
<aside class="hidden w-64 shrink-0 border-r border-slate-200 bg-white lg:flex lg:flex-col print:hidden">
  <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-6">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-900 text-white font-semibold">FR</div>
    <div class="leading-tight">
      <div class="text-sm font-semibold">Foremost Roofing</div>
      <div class="text-xs text-slate-500">Operations</div>
    </div>
  </div>
  <nav class="flex-1 space-y-0.5 px-3 py-4">
    {% for link in sidebar_links %}
      <a href="{% url link.url_name %}"
         class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium
                {% if request.resolver_match.url_name == link.url_name %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
        <span class="inline-flex h-5 w-5 items-center justify-center">{% icon link.icon %}</span>
        <span>{{ link.label }}</span>
      </a>
    {% endfor %}
  </nav>
  <div class="border-t border-slate-200 px-4 py-4">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-200 text-sm font-semibold text-slate-700">
        {{ user.username|slice:":1"|upper }}
      </div>
      <div class="min-w-0">
        <div class="truncate text-sm font-semibold">{{ user.get_full_name|default:user.username }}</div>
        <div class="text-xs text-slate-500">{{ role_label }}</div>
      </div>
    </div>
    <form action="{% url 'logout' %}" method="post" class="mt-3">
      {% csrf_token %}
      <button class="w-full rounded-md border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50">Sign out</button>
    </form>
  </div>
</aside>
