<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/50 p-4 sm:p-8"
     x-data @click.self="$el.remove()" @keydown.escape.window="$el.remove()">
  <div class="my-auto w-full max-w-5xl rounded-2xl bg-slate-50 shadow-xl">
    <div class="flex items-center justify-between rounded-t-2xl border-b border-slate-200 bg-white px-6 py-3">
      <span class="text-sm font-medium text-slate-500">{{ modal_title|default:'Details' }}</span>
      <div class="flex items-center gap-3">
        {% if full_url %}<a href="{{ full_url }}" class="text-xs font-medium text-blue-600 hover:underline">Open full page</a>{% endif %}
        <button type="button" onclick="this.closest('.fixed').remove()"
                class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="p-6">
      {% include body_template %}
    </div>
  </div>
</div>
