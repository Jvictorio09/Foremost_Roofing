{% comment %}Reusable labelled field. Params: field, wrap (css classes), hint.{% endcomment %}
<div class="{{ wrap }}">
  <label class="block text-xs font-medium text-slate-600">
    {{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}
  </label>
  <div class="mt-1">{{ field }}</div>
  {% if hint %}<p class="mt-1 text-xs text-slate-400">{{ hint }}</p>{% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-400">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="mt-1 text-xs text-rose-600">{{ field.errors|striptags }}</p>{% endif %}
</div>
