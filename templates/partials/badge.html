{% load core_tags %}
{% with tone=status_tone|get_item:status %}
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
  {% if tone == 'gray' %}bg-slate-100 text-slate-700
  {% elif tone == 'blue' %}bg-blue-50 text-blue-700
  {% elif tone == 'yellow' %}bg-amber-50 text-amber-700
  {% elif tone == 'red' %}bg-rose-50 text-rose-700
  {% elif tone == 'green' %}bg-emerald-50 text-emerald-700
  {% else %}bg-slate-100 text-slate-700{% endif %}">
  {{ label }}
</span>
{% endwith %}
